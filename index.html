
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Budget Tracker</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-image: url('background.jpg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            margin: 0;
            padding: 30px;
            min-height: 100vh;
        }

        /* Background overlay */
        body::before {
            content: "";
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 255, 255, 0.35);
            z-index: -1;
        }

        .container {
            max-width: 800px;
            margin: auto;
            background: rgba(255, 255, 255, 0.92);
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
            backdrop-filter: blur(8px);
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 25px;
        }

        h2 {
            color: #2c3e50;
        }

        .budget {
            background: #e8f5e9;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            margin-bottom: 25px;
            border-left: 5px solid #2e7d32;
        }

        .budget h2 {
            color: #1b5e20;
        }

        #total {
            color: #2e7d32;
            font-size: 32px;
        }

        form {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 25px;
        }

        input, select, button {
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        input, select {
            flex: 1;
            min-width: 150px;
            background: white;
        }

        button {
            background: #2e7d32;
            color: white;
            cursor: pointer;
            border: none;
            transition: background 0.2s;
        }

        button:hover {
            background: #1b5e20;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            overflow: hidden;
            border-radius: 8px;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #e8f5e9;
            color: #1b5e20;
        }

        tr:hover {
            background: #f8fff8;
        }

        .delete-btn {
            background: #d32f2f;
        }

        .delete-btn:hover {
            background: #b71c1c;
        }

        /* Mobile responsive design */
        @media (max-width: 600px) {
            body {
                padding: 15px;
            }

            .container {
                padding: 20px;
            }

            form {
                flex-direction: column;
            }

            input, select, button {
                width: 100%;
            }

            table {
                font-size: 12px;
            }

            th, td {
                padding: 8px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🎓 Student Budget Tracker</h1>

    <div class="budget">
        <h2>Total Expenses</h2>
        <h2 id="total">$0.00</h2>
    </div>

    <h2>Add Expense</h2>

    <form id="expenseForm">
        <input type="text" id="expenseName" placeholder="Expense name" required>

        <input type="number" id="amount" placeholder="Amount ($)" min="0.01" step="0.01" required>

        <select id="category" required>
            <option value="">Select Category</option>
            <option>Food</option>
            <option>Transportation</option>
            <option>Education</option>
            <option>Entertainment</option>
            <option>Shopping</option>
            <option>Other</option>
        </select>

        <input type="date" id="date" required>

        <button type="submit">Add Expense</button>
    </form>

    <h2>Expense History</h2>

    <table>
        <thead>
            <tr>
                <th>Name</th>
                <th>Amount</th>
                <th>Category</th>
                <th>Date</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="expenseList">
        </tbody>
    </table>

</div>

<script>
    const expenseForm = document.getElementById("expenseForm");
    const expenseList = document.getElementById("expenseList");
    const totalDisplay = document.getElementById("total");

    let expenses = [];

    expenseForm.addEventListener("submit", function(event) {
        event.preventDefault();

        const name = document.getElementById("expenseName").value;
        const amount = parseFloat(document.getElementById("amount").value);
        const category = document.getElementById("category").value;
        const date = document.getElementById("date").value;

        const expense = {
            name: name,
            amount: amount,
            category: category,
            date: date
        };

        expenses.push(expense);

        displayExpenses();

        expenseForm.reset();
    });

    function displayExpenses() {
        expenseList.innerHTML = "";

        let total = 0;

        expenses.forEach(function(expense, index) {
            total += expense.amount;

            const row = document.createElement("tr");

            row.innerHTML = `
                <td>${expense.name}</td>
                <td>$${expense.amount.toFixed(2)}</td>
                <td>${expense.category}</td>
                <td>${expense.date}</td>
                <td>
                    <button class="delete-btn" onclick="deleteExpense(${index})">
                        Delete
                    </button>
                </td>
            `;

            expenseList.appendChild(row);
        });

        totalDisplay.textContent = "$" + total.toFixed(2);
    }

    function deleteExpense(index) {
        expenses.splice(index, 1);
        displayExpenses();
    }
</script>

</body>
</html>
