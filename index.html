
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Budget Tracker</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background-image: url("./background.png");
            background-size: cover;
            background-position: center center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            margin: 0;
            padding: 30px;
            min-height: 100vh;
            position: relative;
        }

        /* Background overlay */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: rgba(240, 245, 240, 0.20);
            z-index: 0;
            pointer-events: none;
        }

        .container {
            position: relative;
            z-index: 1;
            max-width: 900px;
            margin: auto;
            background: rgba(255, 255, 255, 0.90);
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.2);
            backdrop-filter: blur(8px);
        }

        h1 {
            text-align: center;
            color: #2c3e50;
            margin-bottom: 30px;
            font-size: 32px;
        }

        h2 {
            color: #2c3e50;
        }

        /* Total Expenses Card */
        .budget {
            background: linear-gradient(135deg, #e8f5e9, #c8e6c9);
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            margin-bottom: 30px;
            border-left: 6px solid #2e7d32;
            box-shadow: 0 4px 12px rgba(46, 125, 50, 0.1);
        }

        .budget h2 {
            color: #1b5e20;
            margin-bottom: 15px;
        }

        #total {
            color: #2e7d32;
            font-size: 36px;
            font-weight: bold;
            margin: 0;
        }

        /* Form */
        form {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 30px;
        }

        input, select, button {
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
        }

        input, select {
            flex: 1;
            min-width: 150px;
            background: white;
        }

        input:focus, select:focus {
            outline: none;
            border-color: #2e7d32;
            box-shadow: 0 0 5px rgba(46, 125, 50, 0.3);
        }

        button {
            background: #2e7d32;
            color: white;
            cursor: pointer;
            border: none;
            transition: 0.2s;
        }

        button:hover {
            background: #1b5e20;
            transform: translateY(-1px);
        }

        /* Expense Table */
        table {
            width: 100%;
            border-collapse: collapse;
            overflow: hidden;
            border-radius: 10px;
            background: white;
        }

        th, td {
            padding: 14px;
            border-bottom: 1px solid #ddd;
            text-align: left;
        }

        th {
            background: #e8f5e9;
            color: #1b5e20;
        }

        tr:hover {
            background: #f5fff5;
        }

        .delete-btn {
            background: #d32f2f;
            padding: 8px 12px;
        }

        .delete-btn:hover {
            background: #b71c1c;
        }

        .empty-message {
            text-align: center;
            color: #777;
            padding: 25px;
        }

        /* Footer */
        .footer {
            text-align: center;
            margin-top: 25px;
            color: #666;
            font-size: 13px;
        }

        /* Mobile Responsive Design */
        @media (max-width: 600px) {

            body {
                padding: 15px;
                background-attachment: scroll;
            }

            .container {
                padding: 20px;
            }

            h1 {
                font-size: 25px;
            }

            #total {
                font-size: 30px;
            }

            form {
                flex-direction: column;
            }

            input, select, button {
                width: 100%;
            }

            table {
                font-size: 12px;
            }

            th, td {
                padding: 8px;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🎓 Student Budget Tracker</h1>

    <!-- Total Expenses -->
    <div class="budget">
        <h2>💰 Total Expenses</h2>
        <h2 id="total">$0.00</h2>
    </div>

    <!-- Add Expense -->
    <h2>➕ Add Expense</h2>

    <form id="expenseForm">

        <input
            type="text"
            id="expenseName"
            placeholder="Expense name"
            required
        >

        <input
            type="number"
            id="amount"
            placeholder="Amount ($)"
            min="0.01"
            step="0.01"
            required
        >

        <select id="category" required>
            <option value="">Select Category</option>
            <option>Food</option>
            <option>Transportation</option>
            <option>Education</option>
            <option>Entertainment</option>
            <option>Shopping</option>
            <option>Housing</option>
            <option>Health</option>
            <option>Other</option>
        </select>

        <input
            type="date"
            id="date"
            required
        >

        <button type="submit">Add Expense</button>

    </form>

    <!-- Expense History -->
    <h2>📊 Expense History</h2>

    <table>

        <thead>
            <tr>
                <th>Name</th>
                <th>Amount</th>
                <th>Category</th>
                <th>Date</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="expenseList">
        </tbody>

    </table>

    <div class="footer">
        Student Budget Tracker | Manage your money wisely 💚
    </div>

</div>

<script>

    const expenseForm = document.getElementById("expenseForm");
    const expenseList = document.getElementById("expenseList");
    const totalDisplay = document.getElementById("total");

    // Load saved expenses from browser
    let expenses = JSON.parse(localStorage.getItem("expenses")) || [];

    // Display expenses when page loads
    displayExpenses();

    // Add new expense
    expenseForm.addEventListener("submit", function(event) {

        event.preventDefault();

        const name = document.getElementById("expenseName").value;
        const amount = parseFloat(document.getElementById("amount").value);
        const category = document.getElementById("category").value;
        const date = document.getElementById("date").value;

        const expense = {
            name: name,
            amount: amount,
            category: category,
            date: date
        };

        expenses.push(expense);

        // Save expenses to browser
        localStorage.setItem("expenses", JSON.stringify(expenses));

        displayExpenses();

        expenseForm.reset();

    });

    // Display expenses
    function displayExpenses() {

        expenseList.innerHTML = "";

        let total = 0;

        if (expenses.length === 0) {

            const row = document.createElement("tr");

            row.innerHTML = `
                <td colspan="5" class="empty-message">
                    No expenses yet. Add your first expense!
                </td>
            `;

            expenseList.appendChild(row);

        }

        expenses.forEach(function(expense, index) {

            total += expense.amount;

            const row = document.createElement("tr");

            row.innerHTML = `
                <td>${expense.name}</td>
                <td>$${expense.amount.toFixed(2)}</td>
                <td>${expense.category}</td>
                <td>${expense.date}</td>
                <td>
                    <button
                        class="delete-btn"
                        onclick="deleteExpense(${index})">
                        Delete
                    </button>
                </td>
            `;

            expenseList.appendChild(row);

        });

        // Update total expenses
        totalDisplay.textContent = "$" + total.toFixed(2);

    }

    // Delete expense
    function deleteExpense(index) {

        expenses.splice(index, 1);

        // Save updated expenses
        localStorage.setItem("expenses", JSON.stringify(expenses));

        displayExpenses();

    }

</script>

</body>
</html>
